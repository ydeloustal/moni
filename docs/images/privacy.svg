<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">Où vivent tes données</title>
  <desc id="d">Les données restent sur l'appareil. Aucun serveur ne les reçoit. Elles n'en sortent que si l'utilisateur crée une sauvegarde chiffrée ou fait un transfert par QR codes vers un autre de ses appareils.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1c2a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.62" r="0.35">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="28" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="64" fill="#4ade80" font-size="15" font-weight="700" letter-spacing="2">CONFIDENTIALITÉ</text>
    <text x="40" y="104" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="-0.5">Où vivent tes données ? Sur ton appareil. Point.</text>

    <!-- Device -->
    <g transform="translate(40 140)">
      <rect width="380" height="272" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#4ade80" stroke-opacity="0.55" stroke-width="2"/>
      <text x="28" y="44" fill="#86efac" font-size="14" font-weight="700" letter-spacing="1.5">TON APPAREIL</text>
      <g font-size="16" fill="#eef1f5">
        <rect x="28" y="64" width="324" height="42" rx="12" fill="#ffffff" fill-opacity="0.06"/>
        <circle cx="50" cy="85" r="6" fill="#60a5fa"/><text x="68" y="91">Revenus, dépenses, catégories</text>
        <rect x="28" y="114" width="324" height="42" rx="12" fill="#ffffff" fill-opacity="0.06"/>
        <circle cx="50" cy="135" r="6" fill="#4ade80"/><text x="68" y="141">Solde, livrets, objectifs</text>
        <rect x="28" y="164" width="324" height="42" rx="12" fill="#ffffff" fill-opacity="0.06"/>
        <circle cx="50" cy="185" r="6" fill="#fb923c"/><text x="68" y="191">Empreinte du code (hachée)</text>
      </g>
      <text x="28" y="240" fill="#9aa4b2" font-size="14">SQLite · IndexedDB · Trousseau / Keystore</text>
    </g>

    <!-- No server -->
    <g transform="translate(520 150)">
      <path d="M54 118a46 46 0 0 1 8-91 62 62 0 0 1 118 14 40 40 0 0 1 2 77z" fill="#ffffff" fill-opacity="0.04" stroke="#3a4456" stroke-width="3" stroke-dasharray="8 7"/>
      <path d="M40 10L200 140" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
      <text x="120" y="186" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Aucun serveur</text>
      <text x="120" y="214" text-anchor="middle" fill="#9aa4b2" font-size="15">Pas de compte, pas d'analytics,</text>
      <text x="120" y="236" text-anchor="middle" fill="#9aa4b2" font-size="15">pas de pub, 0 appel réseau</text>
    </g>
    <path d="M424 222H500" stroke="#3a4456" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M762 222H846" stroke="#3a4456" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- User-controlled exits -->
    <g transform="translate(870 140)">
      <text x="0" y="22" fill="#9aa4b2" font-size="14" font-weight="700" letter-spacing="1.5">SEULEMENT SI TU LE DÉCIDES</text>
      <rect y="42" width="370" height="104" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <rect x="20" y="66" width="56" height="56" rx="16" fill="#1b2b45"/>
      <g transform="translate(32 78)" fill="none" stroke="#8dbaf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2z"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
      <text x="96" y="90" fill="#ffffff" font-size="19" font-weight="700">Sauvegarde .moni</text>
      <text x="96" y="116" fill="#b6c0ce" font-size="15">Chiffrée par ta phrase de passe</text>

      <rect y="164" width="370" height="104" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
      <rect x="20" y="188" width="56" height="56" rx="16" fill="#2a2347"/>
      <g transform="translate(32 200)" fill="none" stroke="#b6a5fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M17 3h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M4 16h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M16 12h1"/><path d="M12 21v-1"/></g>
      <text x="96" y="212" fill="#ffffff" font-size="19" font-weight="700">Transfert QR</text>
      <text x="96" y="238" fill="#b6c0ce" font-size="15">Vers ton autre appareil, chiffré</text>
    </g>

    <path d="M230 412V444Q230 460 246 460H814Q830 460 830 444V250Q830 234 846 234H864" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M830 372Q830 356 846 356H864" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="530" y="450" text-anchor="middle" fill="#86efac" font-size="14" font-weight="600">export volontaire, toujours chiffré</text>
  </g>
</svg>
