<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="t d">
  <title id="t">Où vivent tes données</title>
  <desc id="d">Les données restent sur l'appareil. Aucun serveur ne les reçoit. Elles n'en sortent que si l'utilisateur crée une sauvegarde chiffrée ou fait un transfert par QR codes vers un autre de ses appareils.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1280" height="430" rx="28" fill="#f6f7f9" stroke="#e7e9ee" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Device -->
    <g transform="translate(70 56)">
      <rect width="340" height="268" rx="26" fill="#0f172a"/>
      <text x="28" y="44" fill="#cbd5e1" font-size="15" font-weight="600" letter-spacing="1.5">TON APPAREIL</text>
      <g font-size="16" fill="#ffffff">
        <rect x="28" y="66" width="284" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
        <circle cx="50" cy="86" r="6" fill="#60a5fa"/><text x="66" y="92">Revenus, dépenses, catégories</text>
        <rect x="28" y="114" width="284" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
        <circle cx="50" cy="134" r="6" fill="#4ade80"/><text x="66" y="140">Solde, livrets, objectifs</text>
        <rect x="28" y="162" width="284" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
        <circle cx="50" cy="182" r="6" fill="#fb923c"/><text x="66" y="188">Empreinte du code (hachée)</text>
      </g>
      <text x="28" y="240" fill="#86efac" font-size="15" font-weight="600">SQLite · IndexedDB · Trousseau / Keystore</text>
    </g>

    <!-- No server -->
    <g transform="translate(520 64)">
      <path d="M54 118a46 46 0 0 1 8-91 62 62 0 0 1 118 14 40 40 0 0 1 2 77z" fill="#ffffff" stroke="#d5d9e0" stroke-width="3" stroke-dasharray="8 7"/>
      <path d="M40 10L200 140" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
      <text x="120" y="190" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">Aucun serveur</text>
      <text x="120" y="218" text-anchor="middle" fill="#5b6577" font-size="15">Pas de compte, pas d'analytics,</text>
      <text x="120" y="240" text-anchor="middle" fill="#5b6577" font-size="15">pas de pub, 0 appel réseau</text>
    </g>
    <path d="M412 132H500" stroke="#d5d9e0" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M760 132H840" stroke="#d5d9e0" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- User-controlled exits -->
    <g transform="translate(860 56)">
      <text x="0" y="22" fill="#5b6577" font-size="15" font-weight="600" letter-spacing="1.5">SEULEMENT SI TU LE DÉCIDES</text>
      <rect y="42" width="350" height="104" rx="20" fill="#ffffff" stroke="#e7e9ee" stroke-width="2"/>
      <rect x="20" y="64" width="56" height="56" rx="16" fill="#e3edfb"/>
      <g transform="translate(32 76)" fill="none" stroke="#1d5bb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-7a2 2 0 0 1 2 -2z"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
      <text x="96" y="88" fill="#0f172a" font-size="19" font-weight="700">Sauvegarde .moni</text>
      <text x="96" y="114" fill="#5b6577" font-size="15">Chiffrée par ta phrase de passe</text>

      <rect y="164" width="350" height="104" rx="20" fill="#ffffff" stroke="#e7e9ee" stroke-width="2"/>
      <rect x="20" y="186" width="56" height="56" rx="16" fill="#ece7fd"/>
      <g transform="translate(32 198)" fill="none" stroke="#5a3bc2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M17 3h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M4 16h3a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1z"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M16 12h1"/><path d="M12 21v-1"/></g>
      <text x="96" y="210" fill="#0f172a" font-size="19" font-weight="700">Transfert QR</text>
      <text x="96" y="236" fill="#5b6577" font-size="15">Vers ton autre appareil, chiffré</text>
    </g>
    <path d="M240 324V384Q240 400 256 400H804Q820 400 820 384V166Q820 150 836 150H850" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M820 288Q820 272 836 272H850" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="530" y="390" text-anchor="middle" fill="#11683a" font-size="14" font-weight="600">export volontaire, chiffré</text>
  </g>
</svg>
