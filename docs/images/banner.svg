<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Moni</title>
  <desc id="d">Moni, gestion de budget personnel privée par conception : 100 % local, chiffré, sur le Web, Android et iOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1c2a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="890" y="62" width="236" height="316" rx="26"/></clipPath>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 110H1280M0 220H1280M0 330H1280"/>
    <path d="M160 0V440M320 0V440M480 0V440M640 0V440M800 0V440M960 0V440M1120 0V440"/>
  </g>

  <!-- Logo -->
  <g transform="translate(88 74) scale(0.09375)">
    <rect width="1024" height="1024" rx="230" fill="#1c2431" stroke="#2b3545" stroke-width="12"/>
    <circle cx="512" cy="512" r="300" fill="#4ade80"/>
    <path d="M362 610V490a75 75 0 0 1 150 0v120M512 490a75 75 0 0 1 150 0v120" fill="none" stroke="#0f172a" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="88" y="268" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="-2">Moni</text>
    <text x="90" y="314" fill="#cbd5e1" font-size="26" font-weight="500">Ton budget, sur ton appareil. Et nulle part ailleurs.</text>

    <!-- Chips -->
    <g font-size="17" font-weight="600">
      <rect x="88" y="344" width="138" height="38" rx="19" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="157" y="369" fill="#86efac" text-anchor="middle">100 % local</text>
      <rect x="238" y="344" width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="322" y="369" fill="#e2e8f0" text-anchor="middle">0 appel réseau</text>
      <rect x="418" y="344" width="122" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="479" y="369" fill="#e2e8f0" text-anchor="middle">Chiffré</text>
      <rect x="552" y="344" width="214" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="659" y="369" fill="#e2e8f0" text-anchor="middle">Web · Android · iOS</text>
    </g>

    <!-- Phone -->
    <rect x="878" y="50" width="260" height="340" rx="36" fill="#0b0f17" stroke="#3a4456" stroke-width="2"/>
    <g clip-path="url(#screen)">
      <rect x="890" y="62" width="236" height="316" fill="#f6f7f9"/>
      <rect x="902" y="78" width="212" height="128" rx="18" fill="#0f172a"/>
      <text x="918" y="106" fill="#cbd5e1" font-size="12">Solde actuel</text>
      <text x="918" y="140" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="-0.5">1 342,50 €</text>
      <rect x="918" y="154" width="88" height="40" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <text x="926" y="170" fill="#cbd5e1" font-size="9">Par jour</text>
      <text x="926" y="186" fill="#ffffff" font-size="14" font-weight="700">41,52 €</text>
      <rect x="1012" y="154" width="90" height="40" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <text x="1020" y="170" fill="#cbd5e1" font-size="9">Fin de mois</text>
      <text x="1020" y="186" fill="#4ade80" font-size="14" font-weight="700">1 038 €</text>

      <rect x="902" y="216" width="212" height="150" rx="18" fill="#ffffff" stroke="#e7e9ee"/>
      <text x="916" y="240" fill="#0f172a" font-size="13" font-weight="700">Prévisions 12 mois</text>
      <path d="M916 344 L940 336 L964 326 L988 318 L1012 306 L1036 296 L1060 282 L1084 270 L1100 262 V352 H916 Z" fill="url(#area)"/>
      <path d="M916 344 L940 336 L964 326 L988 318 L1012 306 L1036 296 L1060 282 L1084 270 L1100 262" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1100" cy="262" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <path d="M916 352H1100" stroke="#d5d9e0"/>
    </g>
    <rect x="980" y="58" width="56" height="8" rx="4" fill="#0b0f17"/>

    <!-- Floating lock badge -->
    <g transform="translate(1166 318)">
      <circle r="34" fill="#1c2431" stroke="#4ade80" stroke-opacity="0.6" stroke-width="2"/>
      <g transform="translate(-14 -14) scale(1.1667)" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </g>
    </g>
  </g>
</svg>
