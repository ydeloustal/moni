# Apache virtual host for the Moni web app, HTTPS part (Debian 12).
# Installed as /etc/apache2/sites-available/moni-le-ssl.conf (certificate managed by certbot).
# Install / update: see docs/deployment.md, section "Apache".
#
# Served directory: /var/www/moni/current, a symlink switched atomically by each deployment
# to /var/www/moni/releases/X.Y.Z. Apache resolves it on every request: no reload needed.
# Requires mod_ssl, mod_headers and mod_rewrite (the latter for the HTTP vhost).

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName moni.mmi24c04.mmi-troyes.fr
    DocumentRoot /var/www/moni/current

    <Directory /var/www/moni>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Single-page app: any path that is not a real file (e.g. /settings, /budget/123)
    # is answered with index.html, and Expo Router renders the route client-side.
    FallbackResource /index.html

    # Files that must always be revalidated, so a new deployment is picked up at once.
    <FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest|version\.txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Hashed bundles produced by expo export: their name changes when their content changes.
    <LocationMatch "^/_expo/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/moni-error.log
    CustomLog ${APACHE_LOG_DIR}/moni-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/moni.mmi24c04.mmi-troyes.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/moni.mmi24c04.mmi-troyes.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
