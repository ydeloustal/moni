# Apache virtual host for the Moni web app, HTTP part (Debian 12).
# Installed as /etc/apache2/sites-available/moni.conf; the HTTPS part is moni-le-ssl.conf.
# Only redirects to HTTPS (the service worker / PWA requires it).
# Rule kept as written by certbot, so `certbot renew` keeps recognising this vhost.

<VirtualHost *:80>
    ServerName moni.mmi24c04.mmi-troyes.fr
    DocumentRoot /var/www/moni/current

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =moni.mmi24c04.mmi-troyes.fr
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
