name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: fails if the bundled regulated rates are past their expected revision.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run rates:check
      - run: npx expo-doctor
      - run: npm run build:web
