name: Release

# Continuous delivery, triggered ONLY by pushing a vX.Y.Z tag on main
# (Git Flow: a release/* or hotfix/* branch is merged into main, then main is tagged).
#
#   checks ──┬── build-web ── deploy-web    VPS: atomic release, health check, auto-rollback
#            └── build-mobile               EAS cloud: Android .aab + .apk (never sent to the VPS)
#
# The version X.Y.Z comes from the tag. It is written into package.json before each build and
# app.config.ts reads it from there, so the web bundle and the Android binaries both carry it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release (or rollback, see rollback.yml) at a time; a deployment is never cancelled halfway.
concurrency:
  group: production
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'
  DEPLOY_PATH: /var/www/moni
  KEEP_RELEASES: '5'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Tag validation + lint, typecheck, tests (same gate as CI, on the exact tagged commit).
  # ---------------------------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to check that the tag is on main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate tag (vX.Y.Z, on main)
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a vX.Y.Z tag"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit of main. Merge release/* or hotfix/* into main, push main, then tag."
            exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "::warning::package.json says $pkg but the tag says $version: the tag wins. Bump package.json in the release branch next time."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci

  # ---------------------------------------------------------------------------------------------
  # Production web build: expo export --platform web + PWA post-processing (service worker, CSP).
  # ---------------------------------------------------------------------------------------------
  build-web:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Inject version
        run: bash scripts/deploy/set-version.sh "$VERSION"

      - run: npm run build:web

      # Read by the health check to prove the new release is the one actually served.
      - name: Stamp version.txt
        run: echo "$VERSION" > dist/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------------------------
  # Deployment to the VPS (SSH + rsync, dedicated non-root user).
  # /var/www/moni/releases/X.Y.Z/ is uploaded, then /var/www/moni/current is switched atomically.
  # If the health check fails, "current" goes back to the previous release and the job fails.
  # ---------------------------------------------------------------------------------------------
  deploy-web:
    needs: [checks, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error::Variable PROD_URL (e.g. https://moni.example.fr) is not set on the 'production' environment"
            exit 1
          fi

      - uses: actions/checkout@v4 # deploy scripts only, the app is not rebuilt here

      - uses: actions/download-artifact@v4
        with:
          name: web-${{ env.VERSION }}
          path: dist

      - uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}

      # Uploaded next to the live release: visitors keep being served "current" meanwhile.
      - name: Upload release ${{ env.VERSION }}
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH/releases/$VERSION.partial'"
          rsync -rlt --delete --chmod=D755,F644 --stats dist/ "vps:$DEPLOY_PATH/releases/$VERSION.partial/"

      - name: Activate release ${{ env.VERSION }}
        id: activate
        run: |
          previous=$(ssh vps bash -s -- "$DEPLOY_PATH" activate "$VERSION" < scripts/deploy/remote.sh)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Now serving $VERSION (previous: ${previous:-none})"

      - name: Health check
        run: bash scripts/deploy/healthcheck.sh "$PROD_URL" "$VERSION"

      - name: Roll back after failed deployment
        if: failure() && steps.activate.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.activate.outputs.previous }}
        run: |
          ssh vps bash -s -- "$DEPLOY_PATH" switch "$PREVIOUS" < scripts/deploy/remote.sh
          echo "::error title=Deployment rolled back::$VERSION failed its health check, $PREVIOUS is served again. Release $VERSION is kept on the server for investigation."

      - name: Prune old releases (keep ${{ env.KEEP_RELEASES }})
        run: ssh vps bash -s -- "$DEPLOY_PATH" prune "$KEEP_RELEASES" < scripts/deploy/remote.sh

  # ---------------------------------------------------------------------------------------------
  # Mobile builds on EAS (cloud). Nothing goes to the VPS.
  # --no-wait: the job only queues the builds (~2 min) instead of idling 10-30 min on the EAS queue.
  # Results and download links: https://expo.dev (project "moni" > Builds); EAS emails on failure.
  # ---------------------------------------------------------------------------------------------
  build-mobile:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Check configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Inject version
        run: bash scripts/deploy/set-version.sh "$VERSION"

      - name: Check the EAS project id
        run: |
          id=$(npx expo config --type public --json 2>/dev/null |
            node -e 'let s = ""; process.stdin.on("data", d => (s += d)).on("end", () => console.log(JSON.parse(s).extra?.eas?.projectId ?? ""))')
          if [ -z "$id" ]; then
            echo "::error::No EAS project id: run 'npx eas-cli@latest init' once, then set EAS_PROJECT_ID in app.config.ts"
            exit 1
          fi

      # Android App Bundle, for the Play Store (versionCode auto-incremented by EAS).
      - name: EAS build - Android .aab (production)
        run: eas build --platform android --profile production --non-interactive --no-wait

      # Same app as an APK, for direct installation.
      - name: EAS build - Android .apk (production-apk)
        run: eas build --platform android --profile production-apk --non-interactive --no-wait
