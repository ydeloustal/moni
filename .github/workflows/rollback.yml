name: Rollback

# Manual rollback of the WEB version: points /var/www/moni/current back to a release still kept on
# the VPS (the last 5). GitHub > Actions > Rollback > Run workflow (branch: main).
# Mobile builds cannot be rolled back this way: ship a new hotfix version instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to serve again (X.Y.Z). Empty = the release just before the current one.'
        required: false
        default: ''

permissions:
  contents: read

# Shared with release.yml: a rollback never runs during a deployment.
concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/moni

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      REQUESTED: ${{ inputs.version }}
    steps:
      - name: Check input and configuration
        run: |
          if [ -n "$REQUESTED" ] && [[ ! "${REQUESTED#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REQUESTED' is not a version (expected X.Y.Z)"
            exit 1
          fi
          if [ -z "$PROD_URL" ]; then
            echo "::error::Variable PROD_URL is not set on the 'production' environment"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}

      - name: Resolve target version
        id: target
        run: |
          ssh vps bash -s -- "$DEPLOY_PATH" list < scripts/deploy/remote.sh
          if [ -n "$REQUESTED" ]; then
            target=${REQUESTED#v}
          else
            target=$(ssh vps bash -s -- "$DEPLOY_PATH" previous < scripts/deploy/remote.sh)
          fi
          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "Rolling back to $target"

      - name: Switch current to ${{ steps.target.outputs.version }}
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: ssh vps bash -s -- "$DEPLOY_PATH" switch "$TARGET" < scripts/deploy/remote.sh

      - name: Health check
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: bash scripts/deploy/healthcheck.sh "$PROD_URL" "$TARGET"
